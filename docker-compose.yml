# The whole app locally, from the three Dockerfiles: docker compose up --build.
# The services are named like the apps in platform.yaml and the stamp's
# postgres container service, so the front end reaches the API at
# http://api:8080 as it reaches http://ca-<stamp>-api in a stamp. The settings
# come from .env, a copy of .env.example (docs/getting-started.md).
name: tl-template-webapp

services:
  postgres:
    # The same Postgres as a dev stamp.
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The init container of api in a stamp: it finishes before api starts.
  migrator:
    build: { context: ., dockerfile: src/Migrator/Dockerfile }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: src/Api/Dockerfile }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
    depends_on:
      migrator: { condition: service_completed_successfully }

  web:
    build: { context: web, dockerfile: Dockerfile }
    environment:
      API_UPSTREAM: http://api:8080
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
      PUBLIC_EXAMPLE: ${PUBLIC_EXAMPLE}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

volumes:
  postgres:
