# The front end's nginx configuration: SPA routing, the /api proxy to the api
# app, security headers, caching, and the health paths the stamp probes. Keep
# /healthz, /readyz, /config.json, /api and the headers when you change it.

# Hashed assets under /assets/ never change, so the browser keeps them for a
# year. The API sets its own caching. Every other file is checked again on each
# visit.
map $uri $cache_control {
    ~^/assets/      "public, max-age=31536000, immutable";
    ~^/api/         "";
    /config.json    "no-store";
    default         "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Every path that isn't a file is a route of the app: index.html, and the
    # router in the browser shows the page or its "not found" page.
    location / {
        try_files $uri /index.html;
    }

    # A missing asset is a 404, not index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # The API, on the page's own origin, so it needs no CORS settings. The
    # path is passed on unchanged: the API serves its routes under /api. The
    # upstream comes from docker-entrypoint.d/40-config.sh: API_UPSTREAM, or
    # the api app of the stamp. nginx resolves it once, at start.
    location /api/ {
        include /etc/nginx/upstream/api.conf;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # Written at container start by docker-entrypoint.d/40-config.sh.
    location = /config.json {
        alias /usr/share/nginx/config/config.json;
        default_type application/json;
    }

    # nginx serves the files itself, so it is alive and ready as soon as it
    # answers. The API has its own probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
